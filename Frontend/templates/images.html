<!DOCTYPE html>
<html>
<head>
  <title>Device {{ device_id }} Images</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .image-gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }
    .image-item {
      border: 1px solid #ccc;
      padding: 10px;
      width: 200px;
      text-align: center;
    }
    .image-item img {
      max-width: 100%;
      height: auto;
    }
    .back-button {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <h1>Images for Device {{ device_id }}</h1>
  
  <button class="back-button" onclick="window.location.href='/'">Back to Devices</button>
  
  {% if images %}
    <div class="image-gallery">
      {% for img in images %}
        <div class="image-item">
          <img src="{{ BACKEND_URL }}{{ img.imageURL }}" alt="Image {{ loop.index }}" style="transform: rotateX(180deg) rotateY(180deg);">
          <p><b>Timestamp: </b></p>
          <p>{{ img.timestamp|toronto_time }}</p>
        </div>
      {% endfor %}
    </div>
  {% else %}
    <p>No images found for this device.</p>
  {% endif %}
</body>
</html>
